# DKMS description of the module: dkms rebuilds it for every kernel the
# machine boots. The version here is the one source of the module version;
# debian/changelog must carry the same number (debian/rules checks).
PACKAGE_NAME="hwsv4l2"
PACKAGE_VERSION="26.09.0"
MAKE[0]="make KVER=$kernelver"
CLEAN="make clean KVER=$kernelver"
BUILT_MODULE_NAME[0]="hwsv4l2"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
